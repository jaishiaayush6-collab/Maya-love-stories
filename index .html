
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maya Love Stories</title>

    <meta name="description" content="नेपाली प्रेम कथा, रोमान्टिक कथा र मन छुने मायाका कथाहरू।">

    <!-- App Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- App Theme Color -->
    <meta name="theme-color" content="#ff4d94">

    <!-- CSS File -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>💗 Maya Love Stories</h1>
        <p>मायाका कथा, मनका भावना</p>
    </header>

    <!-- Main Content -->
    <main id="app">

        <section id="home">
            <h2>स्वागत छ Maya Love Stories मा!</h2>
            <p>यहाँ तिमी मायाका कथा पढ्न र आफ्नै कथा लेख्न सक्छौ।</p>
        </section>

        <!-- Stories will appear here -->
        <section id="stories">
            <h2>प्रेम कथाहरू</h2>
            <div id="story-list"></div>
        </section>

        <!-- Write Story -->
        <section id="write-story">
            <h2>आफ्नो कथा लेख्नुहोस्</h2>

            <input
                type="text"
                id="story-title"
                placeholder="कथाको शीर्षक लेख्नुहोस्"
            >

            <textarea
                id="story-content"
                placeholder="आफ्नो कथा यहाँ लेख्नुहोस्..."
            ></textarea>

            <button id="save-story">कथा सुरक्षित गर्नुहोस्</button>
        </section>

    </main>

    <!-- JavaScript Files -->
    <script src="./js/stories.js" defer></script>
    <script src="./js/script.js" defer></script>

    <!-- Service Worker Registration -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(function () {
                        console.log("Maya Love Stories Offline Ready!");
                    })
                    .catch(function (error) {
                        console.log("Service Worker Error:", error);
                    });
            });
        }
    </script>

</body>
</html>
